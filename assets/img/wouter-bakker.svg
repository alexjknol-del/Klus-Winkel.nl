    <!-- collar -->
    <path d="M100 158 L120 182 L140 158" fill="none" stroke="#e7e0d5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- neck -->
    <rect x="104" y="140" width="32" height="28" rx="10" fill="#e3b48a"/>
    <!-- head -->
    <ellipse cx="120" cy="102" rx="52" ry="56" fill="#e9bd92"/>
    <!-- ears -->
    <circle cx="66" cy="104" r="9" fill="#e3b48a"/>
    <circle cx="174" cy="104" r="9" fill="#e3b48a"/>
    <!-- hair -->
    <path d="M66 92 C64 52 92 34 120 34 C150 34 176 54 174 92 C174 70 152 58 120 58 C90 58 68 70 66 92 Z" fill="#5a4636"/>
    <path d="M66 96 C64 78 70 66 78 60 C72 74 72 92 74 108 Z" fill="#5a4636"/>
    <path d="M174 96 C176 78 170 66 162 60 C168 74 168 92 166 108 Z" fill="#5a4636"/>
    <!-- beard -->
    <path d="M78 118 C78 148 96 168 120 168 C144 168 162 148 162 118 C162 138 146 156 120 156 C94 156 78 138 78 118 Z" fill="#5a4636" opacity="0.85"/>
    <!-- eyebrows -->
    <path d="M92 90 Q102 84 112 90" stroke="#4a3a2c" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M128 90 Q138 84 148 90" stroke="#4a3a2c" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="102" cy="100" r="5" fill="#2b3440"/>
    <circle cx="138" cy="100" r="5" fill="#2b3440"/>
    <!-- nose -->
    <path d="M120 100 L116 118 Q120 122 124 118 Z" fill="#dba777"/>
    <!-- mouth -->
    <path d="M106 132 Q120 140 134 132" stroke="#5a4636" stroke-width="0" fill="none"/>
    <path d="M104 130 Q120 138 136 130 Q120 136 104 130 Z" fill="#8a5a3f"/>
    <!-- cap -->
    <path d="M60 78 C60 40 88 22 120 22 C152 22 180 40 180 78 L180 70 C180 66 176 64 172 64 L68 64 C64 64 60 66 60 70 Z" fill="#d9631e"/>
    <path d="M60 70 C60 66 64 64 68 64 L172 64 C176 64 180 66 180 70 L180 76 L60 76 Z" fill="#a84815"/>
  </g>
</svg>
